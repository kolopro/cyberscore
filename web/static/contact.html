<style>
  :root{
    --ink:#1f2933; --muted:#616e7c; --line:#dfe4e8; --bg:#eef1f4;
    --card:#ffffff; --navy1:#1f4e79; --navy2:#122a44; --teal:#1e8fa0; --low:#2471a3;
    --ok:#1e8449; --high:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg)}
  header{background:linear-gradient(160deg,var(--navy1),var(--navy2));color:#eafcff;padding:22px 20px}
  header .bar{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
  header a.logo{font-size:20px;font-weight:800;color:#eafcff;text-decoration:none}
  header a.back{color:#bfe3ea;text-decoration:none;font-size:13px;font-weight:600}
  header a.back:hover{text-decoration:underline}
  main{max-width:720px;margin:26px auto 0;padding:0 20px 60px}
  h1{font-size:26px;margin:0 0 6px;color:var(--navy2)}
  .lead{color:#555;margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 26px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  label{display:block;font-size:13px;font-weight:600;color:var(--navy2);margin:14px 0 5px}
  label:first-child{margin-top:0}
  input,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fcfdfe}
  input:focus,textarea:focus{outline:none;border-color:var(--teal)}
  textarea{min-height:140px;resize:vertical}
  .hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
  button{margin-top:18px;background:var(--teal);color:#fff;border:0;border-radius:10px;
         font-weight:800;font-size:15px;padding:13px 26px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:16px;padding:12px 15px;border-radius:9px;font-size:14px;display:none}
  .msg.ok{display:block;background:#e8f5ee;color:var(--ok);border:1px solid #bfe3cd}
  .msg.err{display:block;background:#fcebe9;color:var(--high);border:1px solid #f3c7c1}
  .alt{margin-top:18px;color:var(--muted);font-size:13px}
  footer{max-width:720px;margin:0 auto;padding:20px;color:var(--muted);font-size:12px;text-align:center}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="/">CyberScore</a>
    <a class="back" href="/">← Back to scanner</a>
  </div>
</header>

<main>
  <h1>Contact us</h1>
  <p class="lead">Questions, feedback, bug reports or partnership enquiries — send us a message and we'll get back to you.</p>

  <div class="card">
    <form id="cform" autocomplete="on">
      <label for="name">Your name</label>
      <input id="name" name="name" required maxlength="100" placeholder="Jane Doe">

      <label for="email">Your email</label>
      <input id="email" name="email" type="email" required maxlength="150" placeholder="you@example.com">

      <label for="subject">Subject</label>
      <input id="subject" name="subject" maxlength="150" placeholder="How can we help?">

      <label for="message">Message</label>
      <textarea id="message" name="message" required maxlength="4000" placeholder="Write your message here…"></textarea>

      <!-- honeypot: bots fill this, humans never see it -->
      <input class="hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off">

      <button id="send" type="submit">Send message</button>
      <div class="msg" id="result"></div>
    </form>
    <p class="alt">Prefer email? Write to <a href="mailto:info@cyberscore.cc">info@cyberscore.cc</a>.</p>
  </div>
</main>

<footer>CyberScore · cyberscore.cc · <a href="/">Home</a> · <a href="/privacy">Privacy Policy</a></footer>

<script>
// Web3Forms access key — get a free one at https://web3forms.com (enter info@cyberscore.cc),
// then paste it here. Until it is set, the form shows a friendly notice.
const ACCESS_KEY = "6aabc883-2831-473e-8900-f36162609c46";

const form = document.getElementById('cform');
const btn = document.getElementById('send');
const result = document.getElementById('result');

function show(kind, text){ result.className = 'msg ' + kind; result.textContent = text; }

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(form.botcheck && form.botcheck.checked) return; // bot caught
  if(!ACCESS_KEY || ACCESS_KEY === "YOUR_WEB3FORMS_ACCESS_KEY"){
    show('err', "The contact form isn't configured yet. Please email info@cyberscore.cc for now.");
    return;
  }
  btn.disabled = true; btn.textContent = 'Sending…'; result.className = 'msg';
  const payload = {
    access_key: ACCESS_KEY,
    name: form.name.value.trim(),
    email: form.email.value.trim(),
    subject: form.subject.value.trim() || 'CyberScore contact form',
    message: form.message.value.trim(),
    from_name: 'CyberScore website',
  };
  try{
    const r = await fetch('https://api.web3forms.com/submit', {
      method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if(data.success){
      form.reset();
      show('ok', "Thanks! Your message has been sent — we'll get back to you soon.");
    }else{
      show('err', (data.message || 'Something went wrong.') + ' You can also email info@cyberscore.cc.');
    }
  }catch(err){
    show('err', "Could not send right now. Please email info@cyberscore.cc instead.");
  }finally{
    btn.disabled = false; btn.textContent = 'Send message';
  }
});
</script>
</body>
