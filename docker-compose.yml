services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # Fill these in later to enable live reputation engines (optional).
      # Without them the site still works via the heuristic fallback.
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
      - GOOGLE_SAFE_BROWSING_KEY=${GOOGLE_SAFE_BROWSING_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
